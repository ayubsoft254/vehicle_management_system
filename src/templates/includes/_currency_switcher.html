{% load company_tags %}
<div id="currency-switcher" class="bg-white border border-gray-200 rounded-xl shadow-sm px-4 py-3 mb-6 flex flex-wrap items-center gap-4">
  <label for="report-currency-select" class="text-sm font-medium text-gray-600 shrink-0"><i class="fas fa-exchange-alt mr-1"></i>Currency:</label>
  <select id="report-currency-select" data-multi-currency=".kes-amount[data-kes]" data-currency-decimals="0"
          data-currency-storage="vms_currency" data-currency-rate-inputs="#currency-switcher [data-cur-rate]"
          class="px-3 py-1.5 border border-gray-300 rounded-lg text-sm font-semibold text-gray-700 hover:bg-gray-50">
    {% currency_options %}
  </select>
  <div class="flex flex-wrap items-center gap-3 text-sm text-gray-500">
    {% for option in brand.currency_options %}
    <label data-rate-for="{{ option.code }}" class="flex items-center gap-1">1 {{ option.code }} = <input data-cur-rate="{{ option.code }}" type="number" step="0.0001" min="0.0001" value="{{ option.rate_value|default_if_none:''|stringformat:'s' }}" class="w-24 border border-gray-300 rounded px-2 py-1 text-gray-700 text-sm"> {{ brand.currency }}</label>
    {% endfor %}
  </div>
</div>

<script>
// Rendering is handled by static/js/multi_currency.js; only show rate inputs for ticked currencies.
document.getElementById('report-currency-select').addEventListener('currencychange', function (e) {
  document.querySelectorAll('#currency-switcher [data-rate-for]').forEach(function (label) {
    label.style.display = e.detail.currencies.indexOf(label.dataset.rateFor) === -1 ? 'none' : '';
  });
});
</script>
