<div id="currency-switcher" class="bg-white border border-gray-200 rounded-xl shadow-sm px-4 py-3 mb-6 flex flex-wrap items-center gap-4">
  <label for="report-currency-select" class="text-sm font-medium text-gray-600 shrink-0"><i class="fas fa-exchange-alt mr-1"></i>Currency:</label>
  <select id="report-currency-select" data-multi-currency=".kes-amount[data-kes]" data-currency-decimals="0"
          data-currency-storage="vms_currency" data-currency-rate-inputs="#currency-switcher [data-cur-rate]"
          class="px-3 py-1.5 border border-gray-300 rounded-lg text-sm font-semibold text-gray-700 hover:bg-gray-50">
    <option value="KES" selected>KES</option>
    <option value="USD">USD</option>
    <option value="EUR">EUR</option>
    <option value="TZS">TZS</option>
    <option value="UGX">UGX</option>
    <option value="JPY">JPY</option>
  </select>
  <div class="flex flex-wrap items-center gap-3 text-sm text-gray-500">
    <label data-rate-for="USD" class="flex items-center gap-1">1 USD = <input id="usd-rate-input" data-cur-rate="USD" type="number" step="0.0001" min="0.0001" value="130" class="w-20 border border-gray-300 rounded px-2 py-1 text-gray-700 text-sm"> KES</label>
    <label data-rate-for="EUR" class="flex items-center gap-1">1 EUR = <input id="eur-rate-input" data-cur-rate="EUR" type="number" step="0.0001" min="0.0001" value="142" class="w-20 border border-gray-300 rounded px-2 py-1 text-gray-700 text-sm"> KES</label>
    <label data-rate-for="TZS" class="flex items-center gap-1">1 TZS = <input id="tzs-rate-input" data-cur-rate="TZS" type="number" step="0.0001" min="0.0001" value="0.052" class="w-20 border border-gray-300 rounded px-2 py-1 text-gray-700 text-sm"> KES</label>
    <label data-rate-for="UGX" class="flex items-center gap-1">1 UGX = <input id="ugx-rate-input" data-cur-rate="UGX" type="number" step="0.0001" min="0.0001" value="0.035" class="w-20 border border-gray-300 rounded px-2 py-1 text-gray-700 text-sm"> KES</label>
    <label data-rate-for="JPY" class="flex items-center gap-1">1 JPY = <input id="jpy-rate-input" data-cur-rate="JPY" type="number" step="0.0001" min="0.0001" value="0.87" class="w-20 border border-gray-300 rounded px-2 py-1 text-gray-700 text-sm"> KES</label>
  </div>
</div>

<script>
// Rendering is handled by static/js/multi_currency.js; only show rate inputs for ticked currencies.
document.getElementById('report-currency-select').addEventListener('currencychange', function (e) {
  document.querySelectorAll('#currency-switcher [data-rate-for]').forEach(function (label) {
    label.style.display = e.detail.currencies.indexOf(label.dataset.rateFor) === -1 ? 'none' : '';
  });
});
</script>
