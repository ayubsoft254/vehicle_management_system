<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mt-3">
    {% for field in f %}
    {% if field.field.widget.input_type == 'checkbox' %}
    <label class="flex items-center gap-2 text-sm text-gray-700 self-end pb-2">{{ field }} {{ field.label }}</label>
    {% else %}
    <div>
        <label for="{{ field.id_for_label }}" class="block text-xs font-medium text-gray-600 mb-1">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<p class="text-xs text-red-600 mt-1">{{ error }}</p>{% endfor %}
    </div>
    {% endif %}
    {% endfor %}
</div>
