{% extends "admin/change_list.html" %}

{% block content %}
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px;">
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:12px;">
        <div style="font-size:12px;color:#6b7280;">Sold Trackers</div>
        <div style="font-size:24px;font-weight:700;color:#111827;">{{ sold_trackers_count }}</div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:12px;">
        <div style="font-size:12px;color:#6b7280;">Sold Trackers Total</div>
        <div style="font-size:24px;font-weight:700;color:#111827;">KES {{ sold_trackers_total|floatformat:2 }}</div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:12px;">
        <div style="font-size:12px;color:#6b7280;">Sold Insurance Total</div>
        <div style="font-size:24px;font-weight:700;color:#111827;">KES {{ sold_insurance_total|floatformat:2 }}</div>
    </div>
</div>
{{ block.super }}
{% endblock %}
