{# One USD charge input in the Japan supplier breakdown. Params: field, label, value #}
<div>
    <label for="japan_{{ field }}" class="block text-sm font-medium text-gray-700 mb-1">{{ label }}</label>
    <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <span class="text-gray-400 text-sm font-medium">$</span>
        </div>
        <input type="number" name="japan_{{ field }}" id="japan_{{ field }}"
            step="0.01" min="0" value="{{ value }}" placeholder="0.00"
            class="w-full pl-8 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
            data-japan-charge oninput="recalcJapanSupplierTotal(true)">
    </div>
</div>
