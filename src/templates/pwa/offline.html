{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — Vehicle Management System</title>
    <style>
        /* Self-contained: no CDN dependencies so it renders with no network. */
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f9fafb;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            text-align: center;
            padding: 2.5rem;
            max-width: 24rem;
        }
        .icon {
            width: 72px;
            height: 72px;
            border-radius: 16px;
            margin: 0 auto 1.5rem;
        }
        h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
        p { color: #64748b; font-size: 0.925rem; line-height: 1.5; margin: 0 0 1.5rem; }
        button {
            background: #2563eb;
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 0.65rem 1.5rem;
            font-size: 0.925rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="card">
        <img class="icon" src="{% static 'pwa/icon-192.png' %}" alt="VMS">
        <h1>You're offline</h1>
        <p>The Vehicle Management System needs an internet connection. Check your connection and try again.</p>
        <button onclick="window.location.reload()">Retry</button>
    </div>
</body>
</html>
