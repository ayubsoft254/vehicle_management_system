<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold
    {% if company.status == 'active' %}bg-green-100 text-green-800{% elif company.status == 'suspended' %}bg-amber-100 text-amber-800{% elif company.status == 'failed' %}bg-red-100 text-red-800{% else %}bg-indigo-100 text-indigo-800{% endif %}"
    data-status-badge>{{ company.get_status_display }}</span>
