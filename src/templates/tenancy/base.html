<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Control Panel{% endblock %} — {{ platform_name|default:"Platform" }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full">
    {% if user.is_authenticated %}
    <header class="bg-white border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
            <a href="{% url 'platform:company_list' %}" class="flex items-center gap-2 font-bold text-gray-900">
                <span class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center"><i class="fas fa-layer-group text-sm"></i></span>
                {{ brand.legal_name }} <span class="text-xs font-medium text-gray-400 ml-1">Control panel</span>
            </a>
            <div class="flex items-center gap-4 text-sm">
                <span class="text-gray-500 hidden sm:inline">{{ user.email }}</span>
                <form method="post" action="{% url 'platform:logout' %}">{% csrf_token %}
                    <button class="text-red-600 hover:text-red-700"><i class="fas fa-sign-out-alt mr-1"></i>Sign out</button>
                </form>
            </div>
        </div>
    </header>
    {% endif %}
    <main class="max-w-6xl mx-auto px-4 py-8">
        {% if messages %}
        <div class="mb-6 space-y-2">
            {% for message in messages %}
            <div class="rounded-lg px-4 py-3 text-sm {% if message.tags == 'error' %}bg-red-50 text-red-800 border border-red-200{% elif message.tags == 'success' %}bg-green-50 text-green-800 border border-green-200{% else %}bg-indigo-50 text-indigo-800 border border-indigo-200{% endif %}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    {% block extra_js %}{% endblock %}
</body>
</html>
