{% extends 'tenancy/base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16 bg-white rounded-xl shadow-sm border border-gray-200 p-8">
    <h1 class="text-xl font-bold text-gray-900 mb-1">{{ brand.legal_name }}</h1>
    <p class="text-sm text-gray-500 mb-6">Platform owner sign-in</p>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% if form.non_field_errors %}<p class="text-sm text-red-600">{{ form.non_field_errors|join:" " }}</p>{% endif %}
        <div>
            <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" name="username" id="id_username" required autofocus value="{{ form.username.value|default:'' }}"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
            <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" name="password" id="id_password" required
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500">
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium">Sign in</button>
    </form>
</div>
{% endblock %}
