<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporarily unavailable</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
               background: #f9fafb; color: #1e293b; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { text-align: center; padding: 2.5rem; max-width: 26rem; }
        h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
        p { color: #64748b; line-height: 1.5; margin: 0; }
    </style>
</head>
<body>
    <div class="card">
        {% if company.status == 'provisioning' %}
        <h1>{{ company.name }} is being set up</h1>
        <p>This usually takes a couple of minutes. Please try again shortly.</p>
        {% else %}
        <h1>{{ company.name }} is temporarily unavailable</h1>
        <p>Please contact the platform administrator.</p>
        {% endif %}
    </div>
</body>
</html>
