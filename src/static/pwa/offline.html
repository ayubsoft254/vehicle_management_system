<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>Offline - Hoza Investment</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f9fafb;
            color: #111827;
        }
        .wrap {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(17, 24, 39, 0.06);
        }
        .icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-weight: 700;
            font-size: 28px;
            color: #ffffff;
        }
        h1 {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: #111827;
        }
        .brand {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #6b7280;
            margin: 0 0 16px 0;
        }
        p.message {
            font-size: 14px;
            line-height: 1.6;
            color: #4b5563;
            margin: 0 0 28px 0;
        }
        button.retry {
            appearance: none;
            border: none;
            background: #111827;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
        }
        button.retry:hover { background: #1f2937; }
        button.retry:active { background: #030712; }
        .hint {
            margin-top: 16px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <div class="icon">H</div>
            <p class="brand">Hoza Investment</p>
            <h1>You're currently offline</h1>
            <p class="message">
                Please reconnect to the internet to continue using the system.
                No account, vehicle, payment, or finance data is stored on this device.
            </p>
            <button class="retry" onclick="window.location.reload();">Retry</button>
            <p class="hint">This page will automatically work again once you're back online.</p>
        </div>
    </div>
</body>
</html>
